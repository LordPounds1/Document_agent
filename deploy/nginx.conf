# ===========================================
# Nginx Reverse Proxy с SSL для Document Processing Agent
# ===========================================
# 
# Установка:
# 1. sudo apt install nginx certbot python3-certbot-nginx
# 2. sudo cp nginx.conf /etc/nginx/sites-available/document-agent
# 3. sudo ln -s /etc/nginx/sites-available/document-agent /etc/nginx/sites-enabled/
# 4. Замените YOUR_DOMAIN на ваш домен
# 5. sudo certbot --nginx -d YOUR_DOMAIN
# 6. sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zone (защита от DDoS)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Upstream для Streamlit
upstream streamlit_app {
    server 127.0.0.1:8501;
    keepalive 32;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    
    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Редирект на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;
    
    # ===========================================
    # SSL/TLS настройки (Modern configuration)
    # ===========================================
    
    # Сертификаты Let's Encrypt (будут созданы certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;
    
    # Современные протоколы
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL оптимизация
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ===========================================
    # Security Headers
    # ===========================================
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Защита от XSS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (настройте под Streamlit)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;
    
    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # ===========================================
    # Локации
    # ===========================================
    
    # Основное приложение
    location / {
        # Rate limiting для обычных запросов
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://streamlit_app;
        proxy_http_version 1.1;
        
        # WebSocket поддержка (для Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # Долгие LLM запросы
        
        # Буферизация
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Streamlit static files
    location /static {
        proxy_pass http://streamlit_app/static;
        proxy_http_version 1.1;
        
        # Кэширование статики
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Streamlit health check
    location /_stcore/health {
        proxy_pass http://streamlit_app/_stcore/health;
        proxy_http_version 1.1;
        
        # Без rate limiting для health checks
        access_log off;
    }
    
    # WebSocket для Streamlit
    location /_stcore/stream {
        proxy_pass http://streamlit_app/_stcore/stream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Долгие соединения
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Блокировка доступа к .py файлам напрямую
    location ~ \.py$ {
        deny all;
    }
    
    # ===========================================
    # Логирование
    # ===========================================
    
    access_log /var/log/nginx/document-agent.access.log;
    error_log /var/log/nginx/document-agent.error.log warn;
    
    # Ограничение размера загрузки (для вложений)
    client_max_body_size 50M;
}
