# ===========================================
# Document Processing Agent - Production Docker Compose
# ===========================================
# 
# Использование:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Особенности продакшен-конфигурации:
# - Порт привязан к localhost (nginx проксирует)
# - Ограничения ресурсов
# - Логирование с ротацией
# - Автоматический перезапуск
# - Фоновый мониторинг через Celery + Redis

services:
  # ===========================================
  # Redis - брокер сообщений для Celery
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: document-agent-redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - document-agent-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ===========================================
  # Streamlit Web UI
  # ===========================================
  document-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-agent
    depends_on:
      redis:
        condition: service_healthy
    
    # Привязка только к localhost (nginx проксирует снаружи)
    ports:
      - "127.0.0.1:8501:8501"
    
    # Volumes
    volumes:
      # Модель LLM (только чтение)
      - ./models:/app/models:ro
      # Шаблоны договоров (только чтение)
      - ./templates:/app/templates:ro
      # Зашифрованные шаблоны (только чтение)
      - ./templates_encrypted:/app/templates_encrypted:ro
      # Данные (чтение/запись) - общая для всех сервисов
      - app_data:/app/data
      # Логи (чтение/запись)
      - ./logs:/app/logs
      # Файл пользователей для аутентификации
      - ./.users:/app/.users
      # WhatsApp/Playwright сессия (сохраняется между перезапусками)
      - ./whatsapp_session:/app/whatsapp_session
      # Скачанные документы из WhatsApp
      - ./whatsapp_downloads:/app/whatsapp_downloads
    
    # Переменные окружения
    environment:
      # LLM
      - MODEL_CONTEXT_SIZE=2048
      - MODEL_TEMPERATURE=0.1
      - MODEL_N_GPU_LAYERS=0  # CPU only в Docker
      - MODEL_MAX_TOKENS=512
      # Агент
      - CHECK_INTERVAL_MINUTES=5
      - LOG_LEVEL=INFO
      # Ключ шифрования (передаётся при запуске)
      - TEMPLATES_KEY=${TEMPLATES_KEY:-}
      # Redis для Celery
      - REDIS_URL=redis://redis:6379/0
      # Ключ шифрования паролей мониторинга
      - MONITOR_ENCRYPTION_KEY=${MONITOR_ENCRYPTION_KEY:-document-agent-secret}
    
    # Политика перезапуска
    restart: always
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Модель + Playwright долго загружаются
    
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G  # LLM требует много RAM
        reservations:
          cpus: '2'
          memory: 6G
    
    # Логирование с ротацией
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Безопасность
    security_opt:
      - no-new-privileges:true
    read_only: false  # Нужна запись в /app/data и /app/logs
    
    # Сеть
    networks:
      - document-agent-network

  # ===========================================
  # Celery Worker - фоновая обработка задач
  # ===========================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-agent-worker
    depends_on:
      redis:
        condition: service_healthy
    
    # Переопределяем команду запуска
    entrypoint: []
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    
    # Volumes (те же что у основного приложения)
    volumes:
      - ./models:/app/models:ro
      - ./templates:/app/templates:ro
      - ./templates_encrypted:/app/templates_encrypted:ro
      - app_data:/app/data
      - ./logs:/app/logs
    
    # Переменные окружения
    environment:
      - MODEL_CONTEXT_SIZE=2048
      - MODEL_TEMPERATURE=0.1
      - MODEL_N_GPU_LAYERS=0
      - MODEL_MAX_TOKENS=512
      - REDIS_URL=redis://redis:6379/0
      - MONITOR_ENCRYPTION_KEY=${MONITOR_ENCRYPTION_KEY:-document-agent-secret}
      - LOG_LEVEL=INFO
    
    restart: always
    
    # Ограничения ресурсов (меньше чем у основного)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - document-agent-network

  # ===========================================
  # Celery Beat - планировщик периодических задач
  # ===========================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-agent-beat
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    
    # Переопределяем команду запуска
    entrypoint: []
    command: celery -A celery_app beat --loglevel=info
    
    # Volumes
    volumes:
      - app_data:/app/data
      - ./logs:/app/logs
    
    # Переменные окружения
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONITOR_ENCRYPTION_KEY=${MONITOR_ENCRYPTION_KEY:-document-agent-secret}
    
    restart: always
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    
    networks:
      - document-agent-network

networks:
  document-agent-network:
    driver: bridge

volumes:
  redis_data:
  app_data:
